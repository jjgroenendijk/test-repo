name: Scheduled Autonomous PR

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-autonomous-pr
  cancel-in-progress: false

jobs:
  schedule-autonomous-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Environment
        run: |
          chmod +x setup.sh
          ./setup.sh

      - name: Start scheduled Jules session
        env:
          GOOGLE_JULES_API: ${{ secrets.GOOGLE_JULES_API }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: uv run .github/scripts/schedule_autonomous_pr.py
